[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# B008: Depends()/Query()/File() in defaults is the idiomatic FastAPI pattern.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
